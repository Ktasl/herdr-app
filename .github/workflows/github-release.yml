name: GitHub Release (Intel Mac)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0

jobs:
  release-intel-mac:
    name: Build & Release (macOS Intel x86_64)
    runs-on: macos-13
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build and Package Intel Mac
        run: |
          bash scripts/package
          if [[ -f "dist/herdr-app-macos-x86_64.tar.gz" ]]; then
            tar -xzf "dist/herdr-app-macos-x86_64.tar.gz" -C dist
            (cd dist && zip -r -y "Herdr-Intel-zh-TW.zip" Herdr.app && rm -rf Herdr.app)
          fi
          ls -lh dist/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/herdr-app-macos-x86_64.tar.gz
            dist/Herdr-Intel-zh-TW.zip
          generate_release_notes: true
